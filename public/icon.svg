  <!-- puerta -->
  <rect x="226" y="304" width="60" height="82" rx="30 30 6 6" fill="#9ec58a"/>
  <circle cx="274" cy="348" r="4.5" fill="#fffaf2"/>
  <!-- corazón -->
  <path d="M256 250 C256 250 226 232 226 212 C226 198 238 190 248 192 C252 193 255 195 256 198 C257 195 260 193 264 192 C274 190 286 198 286 212 C286 232 256 250 256 250 Z" fill="#fffaf2"/>
  <!-- suelo -->
  <rect x="130" y="384" width="252" height="14" rx="7" fill="#6a9d5a"/>
</svg>
