      <stop offset="0" stop-color="#ffe8cf"/>
      <stop offset="0.6" stop-color="#fbd0c4"/>
      <stop offset="1" stop-color="#e6b8d0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- cuerpo -->
  <rect x="150" y="238" width="212" height="148" rx="14" fill="#fffaf2"/>
