# Métricas semanales de calidad, seguridad y rendimiento (domingos de madrugada) + CodeQL.
# Publica metrics/latest.json y metrics/runs/<fecha>.json en la rama `metrics-data` (no toca casita-sync ni main).
# Un agente programado de Claude lee esa rama, compara con la semana anterior y escribe el informe en Notion.
# Nunca despliega nada: solo ejecuta tests y escáneres y escribe archivos de métricas.
# NOTA: GitHub solo ejecuta los flujos programados desde la rama por defecto; se activa al promover casita-sync a main.
name: Métricas semanales
on:
  schedule: [{ cron: '17 5 * * 0' }]
  workflow_dispatch: {}

concurrency: { group: weekly-metrics, cancel-in-progress: false }
permissions: { contents: read }

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write, actions: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3

  # Mide con permisos de SOLO lectura: aquí corren dependencias de terceros (npm, playwright, firebase-tools).
  measure:
    runs-on: ubuntu-latest
    needs: codeql
    if: ${{ !cancelled() }}
    timeout-minutes: 45
    permissions: { contents: read, security-events: read, actions: read }
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Instalar gitleaks (con comprobación de checksum)
        run: |
          set -e
          V=8.21.2; B=https://github.com/gitleaks/gitleaks/releases/download/v$V
          curl -sSLO $B/gitleaks_${V}_linux_x64.tar.gz; curl -sSLO $B/gitleaks_${V}_checksums.txt
          grep " gitleaks_${V}_linux_x64.tar.gz\$" gitleaks_${V}_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_${V}_linux_x64.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/
      - name: Restaurar el historial de métricas (si ya existe la rama)
        run: |
          set -e
          if git ls-remote --exit-code --heads origin metrics-data >/dev/null 2>&1; then
            git fetch origin metrics-data   # si falla, el trabajo falla: no se publica sin historial
            git checkout origin/metrics-data -- metrics/latest.json metrics/runs
          fi
      - run: node tools/metrics.mjs --perf --rules
      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            metrics/latest.json
            metrics/runs/

  # Publica añadiendo un commit encima de metrics-data (sin force-push, sin perder historial). Aquí no corre código de terceros.
  publish:
    runs-on: ubuntu-latest
    needs: measure
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: metrics, path: new }
      - name: Publicar en metrics-data
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', REPO: '${{ github.repository }}' }
        run: |
          set -e
          git init -q repo && cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git config user.name metrics-bot && git config user.email metrics-bot@users.noreply.github.com
          if git ls-remote --exit-code --heads origin metrics-data >/dev/null 2>&1; then
            git fetch -q origin metrics-data && git checkout -q -B metrics-data origin/metrics-data
          else
            git checkout -q --orphan metrics-data
          fi
          mkdir -p metrics/runs
          cp -r ../new/latest.json metrics/latest.json; cp -r ../new/runs/. metrics/runs/
          git add -f metrics
          git commit -qm "Métricas $(date -u +%F)"
          git push origin metrics-data
