# Métricas semanales de calidad, seguridad y rendimiento (domingos de madrugada) + CodeQL.
# Publica metrics/latest.json y metrics/runs/<fecha>.json en la rama `metrics-data` (no toca casita-sync ni main).
# Un agente programado de Claude lee esa rama, compara con la semana anterior y escribe el informe en Notion.
# Nunca despliega nada: solo ejecuta tests y escáneres y escribe archivos de métricas.
name: Métricas semanales
on:
  schedule: [{ cron: '17 5 * * 0' }]
  workflow_dispatch: {}

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3

  metrics:
    runs-on: ubuntu-latest
    needs: codeql
    if: ${{ !cancelled() }}
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Instalar gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Traer el historial de métricas
        run: |
          git fetch origin metrics-data:metrics-data || true
          if git rev-parse --verify metrics-data >/dev/null 2>&1; then git checkout metrics-data -- metrics/latest.json metrics/runs 2>/dev/null || true; fi
      - name: Medir
        run: node tools/metrics.mjs --perf --rules
      - name: Publicar en la rama metrics-data
        run: |
          mkdir -p /tmp/md && cp -r metrics /tmp/md/
          git config user.name "metrics-bot" && git config user.email "metrics-bot@users.noreply.github.com"
          git checkout --orphan metrics-tmp && git rm -rf -q . || true
          cp -r /tmp/md/metrics . 
          git add metrics && git commit -qm "Métricas $(date -u +%F)"
          git push -f origin HEAD:metrics-data
      - uses: actions/upload-artifact@v4
        with: { name: metrics, path: metrics/ }
